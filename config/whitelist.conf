# 清理白名单配置文件
# 在此文件中列出的路径将被保护，不会被清理脚本删除
# 支持使用 ~ 表示用户主目录
# 以 # 开头的行为注释

# 系统关键目录（默认已保护，此处仅作说明）
# /
# /bin
# /sbin
# /usr
# /etc
# /var
# /opt

# 用户重要目录
~/Documents
~/Desktop
~/Pictures
~/Videos
~/Music

# 开发项目目录（根据实际情况添加）
# ~/Projects
# ~/Workspace
# ~/Code

# 配置文件目录
~/.ssh
~/.config
~/.bashrc
~/.zshrc
~/.bash_profile
~/.zsh_profile

# 其他需要保护的目录（请根据实际情况添加）
# ~/ImportantData
