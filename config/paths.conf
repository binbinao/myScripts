# 路径配置文件
# 定义清理脚本使用的自定义路径和阈值

# 大文件阈值（字节），默认 100MB
LARGE_FILE_THRESHOLD=104857600

# 临时文件目录（多个目录用空格分隔）
TEMP_DIRS=(
    "$HOME/Downloads"
    "$HOME/Desktop"
    "/tmp"
    "/var/tmp"
)

# 日志文件目录（多个目录用空格分隔）
LOG_DIRS=(
    "$HOME/.cache"
    "/var/log"
    "$HOME/Library/Logs"
)

# node_modules 清理深度（0=仅当前目录，1=一级子目录，-1=递归所有）
NODE_MODULES_DEPTH=-1

# Python 缓存文件模式
PYTHON_CACHE_PATTERNS=(
    "__pycache__"
    "*.pyc"
    "*.pyo"
    "*.pyd"
    ".Python"
    "*.so"
    "*.egg-info"
)

# Git 清理选项
GIT_CLEAN_ORPHAN_BRANCHES=true
GIT_CLEAN_STALE_REFS=true
GIT_CLEAN_LARGE_FILES=true

# Docker 清理选项
DOCKER_CLEAN_UNUSED_IMAGES=true
DOCKER_CLEAN_STOPPED_CONTAINERS=true
DOCKER_CLEAN_UNUSED_VOLUMES=true
DOCKER_CLEAN_UNUSED_NETWORKS=true

# 包管理器缓存目录
NPM_CACHE_DIR="$HOME/.npm"
YARN_CACHE_DIR="$HOME/.yarn/cache"
PNPM_CACHE_DIR="$HOME/.pnpm-store"
PIP_CACHE_DIR="$HOME/.cache/pip"
BREW_CACHE_DIR="$HOME/Library/Caches/Homebrew"

# 系统缓存目录（macOS）
MACOS_CACHE_DIRS=(
    "$HOME/Library/Caches"
    "/Library/Caches"
    "/System/Library/Caches"
)

# 系统缓存目录（Linux）
LINUX_CACHE_DIRS=(
    "$HOME/.cache"
    "/var/cache"
)
